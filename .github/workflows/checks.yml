name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  paper-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/analysis.txt
      - run: python -m pip install -r requirements/analysis.txt
      - run: python tools/check_repository.py
      - run: python tools/reproduce_paper.py
      - run: python tools/build_kaggle_bundle.py all
      - run: python tools/build_release.py
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [multimodel, minor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/tests-${{ matrix.profile }}.txt
      - if: matrix.profile == 'multimodel'
        run: python tools/run_tests.py multimodel legacy
      - if: matrix.profile == 'minor'
        run: python tools/run_tests.py minor_revision
